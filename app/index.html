<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Приветствие</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<video id="vid-wall" loop muted playsinline></video>
<canvas id="anim-wall"></canvas>
<img id="wall" src="" alt="">
<div id="wall-overlay"></div>

<button id="btn-back">← Меню</button>

<div id="main" class="layer">
  <div id="clock-wrap">
    <div id="clock">--:--</div>
    <div id="date"></div>
    <div id="weather">
      <span id="w-icon"></span>
      <span id="w-temp"></span>
      <span id="w-desc"></span>
    </div>
    <div id="greeting"></div>
    <div id="tts-status"></div>
  </div>
</div>

<div id="saver" class="layer hidden">
  <div id="saver-clock">--:--</div>
  <div id="saver-date"></div>
</div>

<div id="settings" class="layer hidden">
  <div class="panel">
    <h2>Настройки</h2>
    <label>Имя <input id="s-name" type="text" maxlength="24"></label>
    <label>Приветствие <input id="s-greeting" type="text" maxlength="40"></label>
    <label>Широта <input id="s-lat" type="text"></label>
    <label>Долгота <input id="s-lon" type="text"></label>
    <label>Сдвиг времени, ч <input id="s-tz" type="number" min="-12" max="12"></label>
    <label>Голос <input id="s-voice" type="checkbox"></label>
    <label>Заставка, мин <input id="s-idle" type="number" min="1" max="120"></label>
    <label>Обои
      <select id="s-wall">
        <option value="video">Видео-фон</option>
        <option value="live">Живые обои</option>
        <option value="photo">Фото</option>
        <option value="gradient">Градиент</option>
      </select>
    </label>
    <label>Категория видео
      <select id="s-videopreset">
        <option value="ocean">🌊 Океан</option>
        <option value="fireplace">🔥 Камин</option>
        <option value="rain">🌧 Дождь</option>
        <option value="snow">❄️ Снег</option>
        <option value="space">🌌 Космос</option>
        <option value="forest">🌲 Лес</option>
        <option value="custom">⭐ Свои ссылки</option>
      </select>
    </label>
    <label>Смена видео, мин <input id="s-videoint" type="number" min="1" max="120"></label>
    <label>Свои ссылки (по одной в строке)
      <textarea id="s-videos" rows="3"></textarea>
    </label>
    <div class="row">
      <button id="s-save">Сохранить</button>
      <button id="s-test">Голос</button>
      <button id="s-close">Закрыть</button>
    </div>
    <p class="hint">↑↓ — навигация · OK — выбор · Жёлтая — настройки · Красная — следующий ролик · Зелёная — приветствие</p>
  </div>
</div>

<div id="debug"></div>
<script src="js/app.js"></script>
</body>
</html>
