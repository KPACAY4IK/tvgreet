<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Приветствие</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="anim-wall"></canvas>
<img id="wall" src="" alt="">
<iframe id="yt-wall" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
<div id="wall-overlay"></div>

<div id="main" class="layer">
  <div id="clock-wrap">
    <div id="clock">--:--</div>
    <div id="date"></div>
    <div id="weather">
      <span id="w-icon"></span>
      <span id="w-temp"></span>
      <span id="w-desc"></span>
    </div>
    <div id="greeting"></div>
    <div id="tts-status"></div>
  </div>
</div>

<div id="saver" class="layer hidden">
  <div id="saver-clock">--:--</div>
  <div id="saver-date"></div>
</div>

<div id="settings" class="layer hidden">
  <div class="panel">
    <h2>Настройки</h2>
    <label>Имя <input id="s-name" type="text" maxlength="24"></label>
    <label>Приветствие <input id="s-greeting" type="text" maxlength="40"></label>
    <label>Широта <input id="s-lat" type="text"></label>
    <label>Долгота <input id="s-lon" type="text"></label>
    <label>Голосовое приветствие <input id="s-voice" type="checkbox"></label>
    <label>Таймер заставки, мин <input id="s-idle" type="number" min="1" max="120"></label>
    <label>Обои
      <select id="s-wall">
        <option value="video">YouTube-видео (реальные кадры)</option>
        <option value="live">Живые обои (небо, звёзды)</option>
        <option value="photo">Случайное фото</option>
        <option value="gradient">Градиент</option>
      </select>
    </label>
    <label>Смена видео, мин <input id="s-videoint" type="number" min="1" max="120"></label>
    <label>Видео (ссылки YouTube, каждое с новой строки)
      <textarea id="s-videos" rows="4" placeholder="https://www.youtube.com/watch?v=..."></textarea>
    </label>
    <div class="row">
      <button id="s-save">Сохранить</button>
      <button id="s-test">Проверить голос</button>
      <button id="s-close">Закрыть</button>
    </div>
    <p class="hint">Жёлтая — настройки · Зелёная — приветствие · Красная — следующий ролик</p>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
